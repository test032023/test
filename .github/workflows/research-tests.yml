name: Research toolkit tests

on:
  push:
    paths:
      - 'research-workflow/**'
      - '.github/workflows/research-tests.yml'
  pull_request:
    paths:
      - 'research-workflow/**'
      - '.github/workflows/research-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research-workflow/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r research-workflow/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s research-workflow/tests -p 'test_*.py' -v
      - name: Compile Python scripts
        run: python -m py_compile research-workflow/scripts/run_research.py
